name: Update pot

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  
jobs:
  update-gettext:
    runs-on: ubuntu-latest
    container:
      image: opensuse/tumbleweed

    steps:
      - name: Install required packages
        run: |
          zypper --non-interactive refresh
          zypper --non-interactive install git gettext-tools qt6-tools-linguist sed grep

      - name: Clone this repository manually
        run: |
          git clone https://github.com/${GITHUB_REPOSITORY}.git repo
          cd repo
          git checkout "${GITHUB_REF_NAME}"

      - name: Clone main project
        run: |
          git clone https://github.com/shundhammer/myrlyn.git myrlyn

      - name: Run makepot
        run: |
          cd myrlyn/src
          ./makepot

      - name: Copy generated POT file
        run: |
          cp myrlyn/src/myrlyn.pot repo/po/myrlyn.pot

      - name: Merge PO files
        run: |
          cd repo
          for f in po/*.po; do
            msgmerge --update --backup=none "$f" po/myrlyn.pot
          done

      - name: Commit changes
        run: |
          cd repo
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add po/*.po po/myrlyn.pot
          git commit -m "Update gettext catalogs" || echo "No changes"
          git push
