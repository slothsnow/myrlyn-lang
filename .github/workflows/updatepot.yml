name: Update pot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  update-gettext:
    runs-on: ubuntu-latest
    container:
      image: opensuse/tumbleweed

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        
      - name: Clone main project
        run: |
          git clone https://github.com/shundhammer/myrlyn.git myrlyn
          ls -R myrlyn
      
      - name: Install gettext + Qt tools
        run: |
          zypper --non-interactive install qt6-tools-linguist gettext
          
      - name: Run makepot with Bash
        run: |
          cd myrlyn/src
          ./makepot

      - name: Copy generated POT file
        run: |
          cp myrlyn/src/myrlyn.pot po/myrlyn.pot

      - name: Merge PO files
        run: |
          for f in po/*.po; do
            msgmerge --update --backup=none "$f" myrlyn/src/myrlyn.pot
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add po/*.po po/myrlyn.pot
          git commit -m "Update gettext catalogs" || echo "No changes"
          git push
