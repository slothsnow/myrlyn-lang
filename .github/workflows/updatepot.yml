name: Update pot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  update-gettext:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Install gettext + Qt tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext qttools5-dev-tools qt6-tools-dev-tools

      - name: Run makepot with Bash
        run: |
          cd myrlyn/src
          bash ./makepot

      - name: Copy generated POT file
        run: |
          cp myrlyn/src/myrlyn.pot po/myrlyn.pot

      - name: Merge PO files
        run: |
          for f in po/*.po; do
            msgmerge --update --backup=none "$f" po/myrlyn.pot
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add po/*.po po/myrlyn.pot
          git commit -m "Update gettext catalogs" || echo "No changes"
          git push
